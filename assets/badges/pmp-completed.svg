<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pmp-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#pmp-gradient)" rx="20"/>
  
  <!-- Inner Frame -->
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="white" stroke-width="4" rx="10"/>
  
  <!-- Icon/Symbol -->
  <circle cx="200" cy="140" r="50" fill="white" opacity="0.2"/>
  <path d="M 200 110 L 220 130 L 200 150 L 180 130 Z" fill="white" stroke="white" stroke-width="3"/>
  <circle cx="200" cy="130" r="8" fill="white"/>
  
  <!-- Text -->
  <text x="200" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white">PMP TRACK</text>
  <text x="200" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white">COMPLETED</text>
  
  <!-- Badge Footer -->
  <text x="200" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.8)">Project Management Professional</text>
  <text x="200" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white">DigiSchool Africa</text>
  
  <!-- Year -->
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.7)">2026</text>
</svg>
