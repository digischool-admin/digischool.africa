<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badge-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="195" fill="url(#badge-gradient)"/>
  
  <!-- Inner White Circle -->
  <circle cx="200" cy="200" r="170" fill="white"/>
  
  <!-- Logo DigiSchool Simplifié -->
  <circle cx="200" cy="150" r="40" fill="url(#badge-gradient)" opacity="0.9"/>
  <text x="200" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white">D</text>
  
  <!-- Texte Principal -->
  <text x="200" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0B1B3A">CERTIFIED</text>
  <text x="200" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#3b82f6">DigiSchool</text>
  
  <!-- Texte Secondaire -->
  <text x="200" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#64748B">AFRICA</text>
  
  <!-- Année -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#22c55e">2026</text>
  
  <!-- Bordure décorative -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="white" stroke-width="8" opacity="0.3"/>
</svg>
