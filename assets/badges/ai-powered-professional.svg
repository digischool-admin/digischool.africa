  <text x="200" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="url(#ai-gradient)">AI</text>
  
  <!-- Main Text -->
  <text x="200" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0B1B3A">AI-POWERED</text>
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#8b5cf6">PROFESSIONAL</text>
  
  <!-- Footer -->
  <text x="200" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#64748B">Certified by</text>
  <text x="200" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#22c55e">DigiSchool Africa</text>
</svg>
