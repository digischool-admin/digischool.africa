<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- DigiSchool Africa Logo - Consistent with DigiLab style -->
  <defs>
    <linearGradient id="digiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Graduation cap + circuit pattern -->
  <g transform="translate(5, 8)">
    <!-- Base circle -->
    <circle cx="22" cy="22" r="20" fill="url(#digiGrad)" opacity="0.15"/>
    
    <!-- Graduation cap -->
    <path d="M12 20 L22 15 L32 20 L22 25 Z" fill="url(#digiGrad)"/>
    <rect x="21" y="25" width="2" height="8" fill="url(#digiGrad)"/>
    <circle cx="22" cy="34" r="2" fill="url(#digiGrad)"/>
    
    <!-- Circuit dots -->
    <circle cx="14" cy="12" r="1.5" fill="#10b981"/>
    <circle cx="30" cy="12" r="1.5" fill="#06b6d4"/>
    <circle cx="14" cy="32" r="1.5" fill="#06b6d4"/>
    <circle cx="30" cy="32" r="1.5" fill="#10b981"/>
    
    <!-- Connection lines -->
    <line x1="14" y1="12" x2="22" y2="15" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <line x1="30" y1="12" x2="22" y2="15" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Text: DigiSchool -->
  <text x="55" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">
    DigiSchool
  </text>
  
  <!-- Text: Africa -->
  <text x="55" y="45" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#10b981">
    AFRICA
  </text>
</svg>
