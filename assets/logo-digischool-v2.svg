<svg width="220" height="60" viewBox="0 0 220 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- D Flashy dans Cercle (Symbole) -->
  <defs>
    <linearGradient id="flashy-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cercle Flashy -->
  <circle cx="28" cy="30" r="24" fill="url(#flashy-gradient)" opacity="0.95" />
  
  <!-- D Blanc dans le cercle -->
  <path d="M 22 20 L 22 40 L 28 40 C 33 40 36 36 36 30 C 36 24 33 20 28 20 Z M 26 24 L 28 24 C 30.5 24 32 26 32 30 C 32 34 30.5 36 28 36 L 26 36 Z" 
        fill="white" 
        stroke="white" 
        stroke-width="0.5" />

  <!-- Texte "Digi" en VERT -->
  <text x="60" y="32" font-family="'Inter', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="url(#green-gradient)">Digi</text>
  
  <!-- Texte "School" en BLEU -->
  <text x="110" y="32" font-family="'Inter', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="url(#blue-gradient)">School</text>

  <!-- Texte "AFRICA" en gris subtil -->
  <text x="60" y="48" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#64748B" letter-spacing="1.5">AFRICA</text>
</svg>
