<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="financeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16A085;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1ABC9C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Coin Stack -->
  <ellipse cx="45" cy="75" rx="18" ry="6" fill="url(#financeGrad)"/>
  <ellipse cx="45" cy="68" rx="18" ry="6" fill="url(#financeGrad)" opacity="0.9"/>
  <ellipse cx="45" cy="61" rx="18" ry="6" fill="url(#financeGrad)" opacity="0.8"/>
  
  <!-- Growth Line -->
  <polyline points="25,85 40,70 55,75 70,60 85,50 100,35" stroke="#16A085" stroke-width="3" fill="none"/>
  <circle cx="100" cy="35" r="4" fill="#1ABC9C"/>
  
  <!-- Dollar Symbol -->
  <text x="85" y="85" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#16A085">$</text>
</svg>
