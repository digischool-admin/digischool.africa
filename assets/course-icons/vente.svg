<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Sales Growth Theme -->
  <defs>
    <linearGradient id="venteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Growth Chart -->
  <g>
    <rect x="25" y="70" width="12" height="20" fill="url(#venteGrad)" opacity="0.6"/>
    <rect x="42" y="55" width="12" height="35" fill="url(#venteGrad)" opacity="0.7"/>
    <rect x="59" y="40" width="12" height="50" fill="url(#venteGrad)" opacity="0.8"/>
    <rect x="76" y="25" width="12" height="65" fill="url(#venteGrad)"/>
  </g>
  
  <!-- Upward Arrow -->
  <path d="M 93 30 L 110 30 L 101.5 15 Z" fill="#2980B9"/>
  <line x1="101.5" y1="30" x2="101.5" y2="90" stroke="#2980B9" stroke-width="3"/>
  
  <!-- Handshake Symbol -->
  <circle cx="35" cy="40" r="6" fill="#3498DB"/>
  <circle cx="50" cy="40" r="6" fill="#2980B9"/>
  <path d="M 35 46 L 42.5 53 L 50 46" stroke="#3498DB" stroke-width="2" fill="none"/>
</svg>
