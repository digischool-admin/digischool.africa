<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Excel Grid Theme -->
  <defs>
    <linearGradient id="excelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1D7A5C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Grid Container -->
  <rect x="20" y="25" width="80" height="70" rx="4" fill="url(#excelGrad)" opacity="0.2"/>
  
  <!-- Grid Lines (Excel Cells) -->
  <g stroke="#27AE60" stroke-width="2" fill="none">
    <line x1="20" y1="45" x2="100" y2="45"/>
    <line x1="20" y1="60" x2="100" y2="60"/>
    <line x1="20" y1="75" x2="100" y2="75"/>
    <line x1="45" y1="25" x2="45" y2="95"/>
    <line x1="70" y1="25" x2="70" y2="95"/>
  </g>
  
  <!-- Chart Symbol (Analytics) -->
  <g>
    <circle cx="32.5" cy="52.5" r="3" fill="#27AE60"/>
    <circle cx="57.5" cy="37.5" r="3" fill="#27AE60"/>
    <circle cx="82.5" cy="67.5" r="3" fill="#1D7A5C"/>
    <polyline points="32.5,52.5 57.5,37.5 82.5,67.5" stroke="#27AE60" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Formula Symbol (fx) -->
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D7A5C" text-anchor="middle">fx</text>
</svg>
