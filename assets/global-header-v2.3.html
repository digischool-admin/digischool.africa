<!-- DigiSchool Africa - Header Global V2.3 (Branding Fort + Zero Duplication) -->
<header class="digischool-global-header" id="ds-header">
  <div class="ds-header-container">
    <a href="/" class="ds-header-logo" aria-label="DigiSchool Africa - Accueil">
      <img src="/assets/logo-digischool-v2.3.svg" alt="DigiSchool Africa" class="ds-logo-img">
    </a>
    
    <nav class="ds-header-nav" id="ds-nav" aria-label="Navigation principale">
      <a href="/" class="ds-nav-link">Accueil</a>
      <a href="/b2c.html" class="ds-nav-link">Formations B2C</a>
      <a href="/companies.html" class="ds-nav-link">Entreprises</a>
      <a href="/b2c-assessment.html" class="ds-nav-link">Auto-évaluation</a>
      <a href="/about-premium.html" class="ds-nav-link">À propos</a>
    </nav>
    
    <div class="ds-header-actions">
      <a href="/b2c.html" class="ds-header-cta">Explorer les formations</a>
      <button class="ds-menu-toggle" id="ds-menu-toggle" aria-label="Menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>

<style>
  /* ===== HEADER GLOBAL V2.3 - ZERO DUPLICATION ===== */
  .digischool-global-header {
    position: sticky;
    top: 0;
    z-index: 9999;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    transition: box-shadow 0.3s ease;
  }
  
  .digischool-global-header.scrolled {
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }
  
  .ds-header-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
  }
  
  /* Logo PLUS GRAND */
  .ds-header-logo {
    flex-shrink: 0;
  }
  
  .ds-logo-img {
    height: 50px;
    width: auto;
    transition: transform 0.3s ease;
  }
  
  .ds-header-logo:hover .ds-logo-img {
    transform: scale(1.05);
  }
  
  /* Navigation */
  .ds-header-nav {
    display: flex;
    align-items: center;
    gap: 36px;
    flex: 1;
    justify-content: center;
  }
  
  .ds-nav-link {
    color: #37474F;
    font-weight: 600;
    font-size: 16px;
    text-decoration: none;
    transition: color 0.2s ease;
    position: relative;
    padding: 8px 4px;
  }
  
  .ds-nav-link:hover {
    color: #26A69A;
  }
  
  .ds-nav-link::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 3px;
    background: linear-gradient(90deg, #26A69A, #1E88E5);
    transition: width 0.3s ease;
  }
  
  .ds-nav-link:hover::after {
    width: 100%;
  }
  
  /* CTA */
  .ds-header-cta {
    padding: 12px 28px;
    background: linear-gradient(135deg, #1E88E5, #7C4DFF, #26A69A);
    color: white;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(30, 136, 229, 0.25);
  }
  
  .ds-header-cta:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(30, 136, 229, 0.35);
  }
  
  /* Menu Mobile */
  .ds-menu-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 10px;
  }
  
  .ds-menu-toggle span {
    width: 26px;
    height: 3px;
    background: #37474F;
    transition: all 0.3s ease;
    border-radius: 3px;
  }
  
  .ds-menu-toggle[aria-expanded="true"] span:nth-child(1) {
    transform: rotate(45deg) translateY(8px);
  }
  
  .ds-menu-toggle[aria-expanded="true"] span:nth-child(2) {
    opacity: 0;
  }
  
  .ds-menu-toggle[aria-expanded="true"] span:nth-child(3) {
    transform: rotate(-45deg) translateY(-8px);
  }
  
  /* Responsive */
  @media (max-width: 960px) {
    .ds-header-container {
      padding: 16px 24px;
    }
    
    .ds-header-nav {
      position: fixed;
      top: 86px;
      left: 0;
      right: 0;
      background: white;
      flex-direction: column;
      padding: 28px;
      gap: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      transform: translateY(-150%);
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .ds-header-nav.active {
      transform: translateY(0);
      opacity: 1;
      pointer-events: all;
    }
    
    .ds-menu-toggle {
      display: flex;
    }
    
    .ds-header-cta {
      display: none;
    }
    
    .ds-logo-img {
      height: 44px;
    }
  }
  
  @media (max-width: 480px) {
    .ds-header-container {
      padding: 14px 18px;
    }
    
    .ds-logo-img {
      height: 38px;
    }
  }
</style>

<script>
(function() {
  const header = document.getElementById('ds-header');
  const menuToggle = document.getElementById('ds-menu-toggle');
  const nav = document.getElementById('ds-nav');
  
  // Scroll effect
  if (header) {
    let lastScroll = 0;
    window.addEventListener('scroll', () => {
      const currentScroll = window.pageYOffset;
      if (currentScroll > 60) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
      lastScroll = currentScroll;
    });
  }
  
  // Mobile menu
  if (menuToggle && nav) {
    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
      menuToggle.setAttribute('aria-expanded', !isExpanded);
      nav.classList.toggle('active');
    });
    
    // Close on outside click
    document.addEventListener('click', (e) => {
      if (!menuToggle.contains(e.target) && !nav.contains(e.target)) {
        menuToggle.setAttribute('aria-expanded', 'false');
        nav.classList.remove('active');
      }
    });
    
    // Close on link click
    nav.querySelectorAll('.ds-nav-link').forEach(link => {
      link.addEventListener('click', () => {
        menuToggle.setAttribute('aria-expanded', 'false');
        nav.classList.remove('active');
      });
    });
  }
})();
</script>
