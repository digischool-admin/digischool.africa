<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icône B2B: Building + Chart -->
  <g opacity="0.4">
    <!-- Immeuble entreprise -->
    <rect x="60" y="40" width="80" height="120" rx="6" stroke="white" stroke-width="3" fill="none"/>
    
    <!-- Fenêtres -->
    <rect x="72" y="55" width="15" height="12" fill="rgba(30, 136, 229, 0.3)"/>
    <rect x="92" y="55" width="15" height="12" fill="rgba(30, 136, 229, 0.3)"/>
    <rect x="113" y="55" width="15" height="12" fill="rgba(30, 136, 229, 0.3)"/>
    
    <rect x="72" y="75" width="15" height="12" fill="rgba(30, 136, 229, 0.3)"/>
    <rect x="92" y="75" width="15" height="12" fill="rgba(30, 136, 229, 0.3)"/>
    <rect x="113" y="75" width="15" height="12" fill="rgba(30, 136, 229, 0.3)"/>
    
    <rect x="72" y="95" width="15" height="12" fill="rgba(30, 136, 229, 0.3)"/>
    <rect x="92" y="95" width="15" height="12" fill="rgba(30, 136, 229, 0.3)"/>
    <rect x="113" y="95" width="15" height="12" fill="rgba(30, 136, 229, 0.3)"/>
    
    <!-- Graph croissance -->
    <polyline points="40,140 60,130 80,125 100,115 120,110" stroke="rgba(34, 197, 94, 0.8)" stroke-width="3" fill="none"/>
    <circle cx="40" cy="140" r="3" fill="rgba(34, 197, 94, 0.8)"/>
    <circle cx="60" cy="130" r="3" fill="rgba(34, 197, 94, 0.8)"/>
    <circle cx="80" cy="125" r="3" fill="rgba(34, 197, 94, 0.8)"/>
    <circle cx="100" cy="115" r="3" fill="rgba(34, 197, 94, 0.8)"/>
    <circle cx="120" cy="110" r="3" fill="rgba(34, 197, 94, 0.8)"/>
    
    <!-- Porte entrée -->
    <rect x="87" y="140" width="26" height="20" rx="2" fill="rgba(124, 77, 255, 0.4)"/>
  </g>
</svg>
