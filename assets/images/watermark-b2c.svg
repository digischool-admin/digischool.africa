<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icône B2C: Ordinateur + Graduation Cap -->
  <g opacity="0.4">
    <!-- Écran ordinateur -->
    <rect x="40" y="60" width="120" height="80" rx="8" stroke="white" stroke-width="3" fill="none"/>
    <line x1="100" y1="140" x2="100" y2="160" stroke="white" stroke-width="3"/>
    <line x1="70" y1="160" x2="130" y2="160" stroke="white" stroke-width="3"/>
    
    <!-- Graduation cap -->
    <path d="M 100 30 L 140 45 L 100 60 L 60 45 Z" stroke="white" stroke-width="2.5" fill="rgba(34, 197, 94, 0.2)"/>
    <rect x="98" y="60" width="4" height="30" fill="white"/>
    <circle cx="100" cy="92" r="3" fill="white"/>
    
    <!-- Étoiles succès -->
    <circle cx="50" cy="90" r="2" fill="rgba(34, 197, 94, 0.6)"/>
    <circle cx="150" cy="100" r="2" fill="rgba(59, 130, 246, 0.6)"/>
    <circle cx="120" cy="50" r="2" fill="rgba(124, 77, 255, 0.6)"/>
  </g>
</svg>
