<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — DigiSchool Africa</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0f1e;
      --card: #1a1f2e;
      --text: #e0e6ed;
      --text-secondary: #8892a6;
      --border: #2d3748;
      --green: #00d4aa;
      --blue: #00a8ff;
      --red: #ff4757;
      --yellow: #ffa502;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 28px;
      background: linear-gradient(135deg, var(--green), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logout-btn {
      background: var(--red);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: var(--green);
    }

    .stat-change {
      font-size: 12px;
      margin-top: 8px;
    }

    .stat-change.positive {
      color: var(--green);
    }

    .stat-change.negative {
      color: var(--red);
    }

    .section {
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 30px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
    }

    .btn {
      background: var(--blue);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #0093e6;
    }

    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      border-color: var(--blue);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 14px;
    }

    td {
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-success {
      background: rgba(0, 212, 170, 0.2);
      color: var(--green);
    }

    .badge-warning {
      background: rgba(255, 165, 2, 0.2);
      color: var(--yellow);
    }

    .badge-danger {
      background: rgba(255, 71, 87, 0.2);
      color: var(--red);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--bg);
      color: var(--blue);
    }

    .chart-placeholder {
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      padding: 12px 24px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }

    .tab:hover {
      color: var(--text);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        gap: 16px;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎓 Admin Dashboard — DigiSchool Africa</h1>
      <button class="logout-btn" onclick="logout()">🚪 Déconnexion</button>
    </header>

    <!-- Key Stats -->
    <div class="stats-grid" id="stats-grid">
      <!-- Will be populated by JS -->
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('overview')">📊 Vue d'ensemble</button>
      <button class="tab" onclick="switchTab('learners')">👥 Apprenants</button>
      <button class="tab" onclick="switchTab('sales')">💰 Ventes</button>
      <button class="tab" onclick="switchTab('courses')">📚 Formations</button>
      <button class="tab" onclick="switchTab('analytics')">📈 Analytics</button>
    </div>

    <!-- Overview Tab -->
    <div id="tab-overview" class="tab-content">
      <div class="section">
        <div class="section-header">
          <h2 class="section-title">📈 Tendances récentes</h2>
          <div>
            <button class="btn-secondary" onclick="refreshData()">🔄 Actualiser</button>
          </div>
        </div>
        <div class="chart-placeholder">
          📊 Graphique de progression - Implémentation avec Chart.js recommandée
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <h2 class="section-title">🔥 Activité récente</h2>
        </div>
        <div id="recent-activity">
          <!-- Will be populated by JS -->
        </div>
      </div>
    </div>

    <!-- Learners Tab -->
    <div id="tab-learners" class="tab-content" style="display:none;">
      <div class="section">
        <div class="section-header">
          <h2 class="section-title">👥 Liste des apprenants</h2>
          <div>
            <button class="btn" onclick="exportLearners()">📥 Exporter CSV</button>
          </div>
        </div>
        <div id="learners-table">
          <!-- Will be populated by JS -->
        </div>
      </div>
    </div>

    <!-- Sales Tab -->
    <div id="tab-sales" class="tab-content" style="display:none;">
      <div class="section">
        <div class="section-header">
          <h2 class="section-title">💰 Ventes et revenus</h2>
          <div>
            <button class="btn" onclick="exportSales()">📥 Exporter CSV</button>
          </div>
        </div>
        <div id="sales-table">
          <!-- Will be populated by JS -->
        </div>
      </div>
    </div>

    <!-- Courses Tab -->
    <div id="tab-courses" class="tab-content" style="display:none;">
      <div class="section">
        <div class="section-header">
          <h2 class="section-title">📚 Performance des formations</h2>
        </div>
        <div id="courses-table">
          <!-- Will be populated by JS -->
        </div>
      </div>
    </div>

    <!-- Analytics Tab -->
    <div id="tab-analytics" class="tab-content" style="display:none;">
      <div class="section">
        <div class="section-header">
          <h2 class="section-title">📈 Analytics détaillés</h2>
          <div>
            <button class="btn" onclick="window.B2CAnalytics.exportToJSON()">📥 Export JSON</button>
          </div>
        </div>
        <div id="analytics-details">
          <!-- Will be populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Load dependencies -->
  <script src="courses-data.js"></script>
  <script src="analytics-b2c.js"></script>
  <script src="b2c-learning-system.js"></script>
  <script src="certificates-engine.js"></script>
  <script src="admin-dashboard.js"></script>
</body>
</html>
