name: DigiSchool Production QA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 9:00 AM UTC (10:00 AM WAT)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  qa-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: qa/package.json
      
      - name: Install Playwright
        working-directory: qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      
      - name: Run Production Tests
        working-directory: qa
        env:
          BASE_URL: https://digischool.africa
        run: npm run test:prod
        continue-on-error: true
        id: tests
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa/playwright-report/
          retention-days: 30
      
      - name: Upload Test JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: qa/test-results.json
          retention-days: 30
      
      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 🧪 DigiSchool QA Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Base URL:** https://digischool.africa" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f qa/test-results.json ]; then
            TOTAL=$(jq '.suites | map(.specs | length) | add' qa/test-results.json)
            PASSED=$(jq '[.suites[].specs[] | select(.ok == true)] | length' qa/test-results.json)
            FAILED=$(jq '[.suites[].specs[] | select(.ok == false)] | length' qa/test-results.json)
            
            echo "### Summary" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ **Passed:** $PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- ❌ **Failed:** $FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- 📊 **Total:** $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "$FAILED" -gt 0 ]; then
              echo "### ⚠️ Failed Tests" >> $GITHUB_STEP_SUMMARY
              jq -r '.suites[].specs[] | select(.ok == false) | "- " + .title' qa/test-results.json >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Test results file not found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 [View full report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
      
      - name: Create Issue on Failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Production QA Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Production QA Test Failure
            
            **Date:** ${new Date().toUTCString()}
            **Workflow:** [View Run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Base URL:** https://digischool.africa
            
            ### Action Required
            - Review the [test report artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            - Fix failing tests
            - Verify production site is functioning correctly
            
            ### Possible Issues
            - 404 errors on critical pages
            - Payment gating rules violated
            - B2B/B2C business rules broken
            - Navigation or UX issues
            
            **Auto-generated by GitHub Actions QA workflow**
            `;
            
            // Check if similar issue exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated-qa,production'
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes('Production QA Failed')
            );
            
            if (existingIssue) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `### New Failure Detected\n\n${body}`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['automated-qa', 'production', 'bug']
              });
            }
